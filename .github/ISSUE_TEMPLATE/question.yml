name: Question
description: Ask for help with Alis setup, configuration, or usage
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Check the Alis documentation first:
        - [Documentation index](https://github.com/llocphann/Alis/tree/stable/docs)
        - [Installation](https://github.com/llocphann/Alis/blob/stable/docs/INSTALL.md)
        - [Keybindings](https://github.com/llocphann/Alis/blob/stable/docs/KEYBINDS.md)
        - [IPC reference](https://github.com/llocphann/Alis/blob/stable/docs/IPC.md)
        - [Known limitations](https://github.com/llocphann/Alis/blob/stable/docs/LIMITATIONS.md)

  - type: textarea
    id: question
    attributes:
      label: Question
      description: What do you need help with
      placeholder: How do I configure a module or surface for my monitor layout?
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: What you have tried
      description: Steps, settings, or documentation you already checked

  - type: textarea
    id: version
    attributes:
      label: Version
      description: Paste the output of `inir version`
      render: shell
    validations:
      required: true

  - type: input
    id: compositor
    attributes:
      label: Compositor
      description: Niri or Hyprland with version
      placeholder: Niri 25.11
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Relevant configuration, monitor layout, screenshots, or logs; remove secrets before posting
