name: Bug report
description: Report broken behavior in Alis
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Search existing [Alis Issues](https://github.com/llocphann/Alis/issues) first. Keep details concise and remove private data from logs.
  - type: textarea
    id: problem
    attributes:
      label: What is broken?
      description: What happened, and what should happen?
      placeholder: Calendar indicators overlap when a day has many events.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Short steps or a screenshot when applicable.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Relevant context (optional)
      description: Alis commit/version, Niri/Quickshell, device/scale and a few redacted log lines if they matter.
    validations:
      required: false
