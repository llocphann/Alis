name: Feature request
description: Suggest a new Alis capability
labels: ["type:feature"]
body:
  - type: markdown
    attributes:
      value: |
        Search [Alis Issues](https://github.com/llocphann/Alis/issues) before submitting a new request. One outcome per Issue; details should be just enough to implement and verify it.
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should change for the user?
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when (optional)
      description: Essential behavior, constraints or edge cases; attach a reference image if useful.
    validations:
      required: false
