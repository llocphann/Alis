name: BRAND-R01 canonical compatibility contracts

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/brand-contracts.yml"
      - "scripts/alis"
      - "scripts/brand-recovery-cli.sh"
      - "scripts/repair-niri-alis-keybinds.sh"
      - "setup"
      - "native/scripts/install-runtime.sh"
      - "flake.nix"
      - "nix/module-common.nix"
      - "nix/home-module.nix"
      - "nix/nixos-module.nix"
      - "modules/settings/AboutConfig.qml"
      - "scripts/test-brand-about-identity.py"
      - "distro/arch/alis-shell/*.install"
      - "distro/arch/alis-shell-git/*.install"
      - "scripts/brand-owner-audit.sh"
      - "scripts/test-brand-owner-audit.sh"
      - "scripts/test-setup-sync-atomic.sh"
      - "sdata/lib/safe-setup-sync.sh"
      - "scripts/test-brand-upgrade-rollback.sh"
      - "scripts/completions/alis.*"
      - "scripts/test-brand-entrypoints.sh"
      - "scripts/test-alis-desktop-update.sh"
      - "sdata/lib/sync-alis-desktop.sh"
      - "sdata/lib/uninstall.sh"
      - "scripts/test-brand-uninstall.sh"
      - "sdata/migrations/061-alis-namespace-alias.sh"
      - "sdata/migrations/034-cliphist-text-watcher.sh"
      - "scripts/test-cliphist-migration-034.sh"
      - "assets/applications/*.desktop"
      - "assets/icons/desktop-symbolic.svg"
      - "Makefile"
      - "sdata/subcmd-install/3.files.sh"
      - "distro/arch/alis-shell/**"
      - "distro/arch/alis-shell-git/**"
      - "nix/package.nix"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Syntax and ownership checks
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/alis scripts/brand-recovery-cli.sh scripts/repair-niri-alis-keybinds.sh scripts/brand-owner-audit.sh scripts/test-brand-entrypoints.sh scripts/test-alis-desktop-update.sh sdata/lib/sync-alis-desktop.sh scripts/test-brand-upgrade-rollback.sh scripts/test-brand-owner-audit.sh scripts/test-setup-sync-atomic.sh sdata/lib/safe-setup-sync.sh
          bash -n scripts/test-brand-uninstall.sh
          bash -n sdata/migrations/034-cliphist-text-watcher.sh scripts/test-cliphist-migration-034.sh sdata/subcmd-install/3.files.sh setup
          test -x scripts/alis
          test -f assets/systemd/alis.service
          grep -Fxq '//@ pragma ShellId alis' shell.qml
          grep -Fxq 'BusName=org.kde.StatusNotifierWatcher' assets/systemd/alis.service
      - name: Setup entrypoint atomic recovery and syntax guard
        shell: bash
        run: bash scripts/test-setup-sync-atomic.sh
      - name: Historical clipboard migration order regression
        shell: bash
        run: bash scripts/test-cliphist-migration-034.sh
      - name: About identity and canonical service compatibility
        shell: bash
        run: python3 scripts/test-brand-about-identity.py
      - name: Public CLI, menu IDs and staged Make ownership
        shell: bash
        run: bash scripts/test-brand-entrypoints.sh
      - name: Public app IDs on repo-copy upgrade
        shell: bash
        run: bash scripts/test-alis-desktop-update.sh
      - name: Uninstall path safety
        shell: bash
        run: bash scripts/test-brand-uninstall.sh
      - name: R9 staged fresh/upgrade/reinstall/rollback
        shell: bash
        run: bash scripts/test-brand-upgrade-rollback.sh
      - name: R10 read-only owner audit safety
        shell: bash
        run: bash scripts/test-brand-owner-audit.sh
      - name: IPC registry unchanged and documented
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/lib/generate-ipc-registry.py --check
          python3 translations/tools/source-parity.py
