name: BRAND-R01 compatibility contracts

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/brand-contracts.yml"
      - "scripts/alis"
      - "flake.nix"
      - "nix/module-common.nix"
      - "nix/home-module.nix"
      - "nix/nixos-module.nix"
      - "modules/settings/About.qml"
      - "modules/waffle/settings/pages/WAboutPage.qml"
      - "distro/arch/inir-shell/*.install"
      - "distro/arch/inir-shell-git/*.install"
      - "scripts/brand-owner-audit.sh"
      - "scripts/test-brand-owner-audit.sh"
      - "scripts/test-setup-sync-atomic.sh"
      - "sdata/lib/safe-setup-sync.sh"
      - "scripts/test-brand-single-owner.sh"
      - "scripts/test-brand-upgrade-rollback.sh"
      - "scripts/completions/alis.*"
      - "scripts/test-brand-entrypoints.sh"
      - "scripts/test-alis-namespace-alias.sh"
      - "scripts/brand-namespace-rollback.sh"
      - "scripts/test-brand-namespace-rollback.sh"
      - "sdata/lib/uninstall.sh"
      - "scripts/test-brand-uninstall.sh"
      - "sdata/migrations/061-alis-namespace-alias.sh"
      - "assets/applications/*.desktop"
      - "assets/icons/desktop-symbolic.svg"
      - "Makefile"
      - "sdata/subcmd-install/3.files.sh"
      - "distro/arch/inir-shell/**"
      - "distro/arch/inir-shell-git/**"
      - "nix/package.nix"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Syntax and ownership checks
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/alis scripts/brand-owner-audit.sh scripts/test-brand-entrypoints.sh scripts/test-alis-namespace-alias.sh scripts/test-brand-single-owner.sh scripts/test-brand-upgrade-rollback.sh scripts/test-brand-owner-audit.sh scripts/test-setup-sync-atomic.sh sdata/lib/safe-setup-sync.sh
          bash -n scripts/brand-namespace-rollback.sh scripts/test-brand-namespace-rollback.sh scripts/test-brand-uninstall.sh
          bash -n sdata/migrations/061-alis-namespace-alias.sh sdata/subcmd-install/3.files.sh setup
          test ! -e assets/systemd/alis.service
          grep -Fq 'ShellId inir' shell.qml
      - name: Setup entrypoint atomic recovery and syntax guard
        shell: bash
        run: bash scripts/test-setup-sync-atomic.sh
      - name: R5 single-owner ShellId and service compatibility
        shell: bash
        run: bash scripts/test-brand-single-owner.sh
      - name: Public CLI, menu IDs and staged Make ownership
        shell: bash
        run: bash scripts/test-brand-entrypoints.sh
      - name: Optional lossless namespace aliases
        shell: bash
        run: |
          bash scripts/test-alis-namespace-alias.sh
          bash scripts/test-brand-namespace-rollback.sh
          bash scripts/test-brand-uninstall.sh
      - name: R9 staged fresh/upgrade/reinstall/rollback
        shell: bash
        run: bash scripts/test-brand-upgrade-rollback.sh
      - name: R10 read-only owner audit safety
        shell: bash
        run: bash scripts/test-brand-owner-audit.sh
      - name: Immutable Arch snapshot includes Alis entrypoints
        shell: bash
        run: |
          set -euo pipefail
          ref="$(sed -n 's/^_source_ref="${INIR_SOURCE_REF:-\([^}]*\)}"$/\1/p' distro/arch/inir-shell/PKGBUILD)"
          test -n "$ref"
          for path in scripts/alis assets/applications/alis.desktop assets/applications/alis-settings.desktop; do
            git cat-file -e "$ref:$path"
          done
          grep -Fq 'assets/applications/alis-settings.desktop' distro/arch/inir-shell/PKGBUILD
          grep -Fq 'assets/applications/alis-settings.desktop' distro/arch/inir-shell-git/PKGBUILD
      - name: IPC registry unchanged and documented
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/lib/generate-ipc-registry.py --check
          python3 translations/tools/source-parity.py
