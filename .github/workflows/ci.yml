name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install local-validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fish jq rsync

      - name: Verify notification retention and Mark-all-read policies
        shell: bash
        run: |
          node scripts/test-notification-live-timeout-policy.mjs
          node scripts/test-notification-read-policy.mjs
          node scripts/test-notification-hover-hold.mjs
          node scripts/test-notification-dock-badge-policy.mjs
          node scripts/test-notification-critical-urgency-policy.mjs
          node scripts/test-notification-swipe-dismiss.mjs
          node scripts/test-notification-group-key-policy.mjs
          python3 scripts/test-abyss-notification-presentation-probe.py

      - name: Verify Automation task-code handoff
        shell: bash
        run: python3 scripts/test-automation-taskflow.py

      - name: Verify native Desktop adapter fails closed without sending
        shell: bash
        run: |
          node --check automation/chat_bridge/native_adapter.mjs
          node --check automation/chat_bridge/native_cli.mjs
          node scripts/test-hadalis-native-session.mjs
          node --check automation/chat_bridge/static_helper_analysis.mjs
          node scripts/test-hadalis-static-helper-analysis.mjs
          node --check automation/chat_bridge/transport_evidence.mjs
          node scripts/test-hadalis-transport-evidence.mjs
          node --check automation/chat_bridge/reconciliation_evidence.mjs
          node scripts/test-hadalis-reconciliation-evidence.mjs
          node --check automation/chat_bridge/receipt_evidence.mjs
          node scripts/test-hadalis-receipt-evidence.mjs
          node --check automation/chat_bridge/legacy_ui_probe.mjs
          node --check automation/chat_bridge/legacy_ui_probe_cli.mjs
          node scripts/test-hadalis-legacy-ui-probe.mjs
          node --check automation/chat_bridge/legacy_ui_response_probe.mjs
          node scripts/test-hadalis-legacy-ui-response-probe.mjs
          node --check automation/chat_bridge/legacy_ui_journal.mjs
          node --check automation/chat_bridge/legacy_ui_acceptance.mjs
          node --check automation/chat_bridge/legacy_ui_acceptance_cli.mjs
          node scripts/test-hadalis-legacy-ui-acceptance.mjs
          node --check automation/chat_bridge/scope_probe.mjs
          node --check scripts/inspect-hadalis-native-scope.mjs
          node scripts/test-hadalis-native-scope-probe.mjs

      - name: Verify restored Automation backend
        shell: bash
        run: |
          python3 scripts/test-hadalis-automation-model.py
          python3 scripts/test-hadalis-automation-storage.py
          python3 scripts/test-hadalis-automation-recovery.py
          python3 scripts/test-hadalis-automation-scheduler.py
          python3 scripts/test-hadalis-automation-startup.py
          python3 scripts/AUTO-F01-service-probe.py self-test
          python3 scripts/test-hadalis-chat-bridge.py
          python3 scripts/test-hadalis-automation-credentials.py
          python3 scripts/test-hadalis-automation-install.py

      - name: Run canonical local validator
        shell: bash
        run: |
          log="$RUNNER_TEMP/hadalis-maintainer-validation.log"
          set +e
          HADALIS_VALIDATION_LOG="$log" bash scripts/validate-maintainer-local.sh --current-repo
          rc=$?
          set -e
          if [[ -f "$log" ]]; then
            echo "===== canonical validator log ====="
            cat "$log"
          fi
          exit "$rc"
