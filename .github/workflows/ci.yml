name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install local-validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fish jq rsync dbus python3-dbus python3-gi

      - name: Verify CAST-F01 display safety and Utilities compatibility
        shell: bash
        run: |
          python3 scripts/test-CAST-F01-display-stage.py
          python3 scripts/test-CAST-F01-project-ui.py
          python3 scripts/test-CAST-F01-audio-stage.py
          python3 scripts/test-CAST-F01-wireless-stage.py
          python3 scripts/test-CAST-F01-signal-strength.py
          dbus-run-session -- /usr/bin/python3 scripts/test-CAST-F01-live-dbus-scan.py
          python3 scripts/test-CAST-F01-capabilities.py
          python3 scripts/test-abyss-display-mode.py
          python3 scripts/test-UTIL-F01-source-delivery.py

      - name: Verify disabled-Parallax wallpaper geometry and Liquid shader contract
        shell: bash
        run: |
          python3 scripts/test-wallpaper-parallax-optout.py
          python3 scripts/test-wallpaper-liquid-contract.py
          python3 scripts/test-wallpaper-abyss-liquid.py

      - name: Verify Weekly Planner recurring schedule recovery
        shell: bash
        run: |
          node scripts/test-weekly-planner-recurring-rollover.mjs
          node scripts/test-weekly-planner-policy.mjs
          python3 scripts/test-weekly-planner-recurring-storage-runtime.py

      - name: Verify notification retention and Mark-all-read policies
        shell: bash
        run: |
          node scripts/test-notification-live-timeout-policy.mjs
          node scripts/test-notification-read-policy.mjs
          node scripts/test-notification-hover-hold.mjs
          node scripts/test-notification-dock-badge-policy.mjs
          node scripts/test-notification-critical-urgency-policy.mjs
          node scripts/test-notification-swipe-dismiss.mjs
          node scripts/test-notification-group-key-policy.mjs
          python3 scripts/test-abyss-notification-presentation-probe.py

      - name: Verify retired Settings routes do not load deleted pages
        shell: bash
        run: python3 scripts/test-retired-settings-routes.py

      - name: Verify retired backend stays absent from shell and packages
        shell: bash
        run: python3 scripts/test-retired-runtime-links.py

      - name: Verify fresh runtime excludes Automation while protecting old installations
        shell: bash
        run: python3 scripts/test-retired-runtime-payload.py

      - name: Syntax check read-only installed-host retirement audit
        shell: bash
        run: python3 -m py_compile scripts/audit-retired-services.py

      - name: Verify retirement audit preserves unresolved private history
        shell: bash
        run: python3 scripts/test-retired-service-audit.py

      - name: Verify desktop context-menu pointer anchor and slide relocation
        shell: bash
        run: |
          python3 scripts/test-desktop-context-menu-hover-contract.py
          python3 scripts/test-desktop-context-menu-fade-relocation-contract.py

      - name: Verify ABYSS-R15 unified Edge modules
        shell: bash
        run: |
          python3 scripts/test-abyss-unified-edge-modules-contract.py
          node scripts/test-abyss-unified-edge-modules.mjs
          python3 scripts/test-abyss-module-layout.py
          node scripts/test-abyss-full-size-modules.mjs
          node scripts/test-abyss-multi-selection.mjs
          # Validates the actual AbyssCorners field host; native pointer
          # portion runs only when Quickshell/Wayland is available.
          bash scripts/test-abyss-corner-content.sh

      - name: Verify Panels Quick Notes card removal keeps existing popup contracts
        shell: bash
        run: |
          python3 scripts/test-quick-notes-corner-contract.py
          python3 scripts/test-notification-center-contract.py

      - name: Verify Yazi automatic theme output
        shell: bash
        run: python3 scripts/test-yazi-auto-theme.py

      - name: Run canonical local validator
        shell: bash
        run: |
          log="$RUNNER_TEMP/hadalis-maintainer-validation.log"
          set +e
          HADALIS_VALIDATION_LOG="$log" bash scripts/validate-maintainer-local.sh --current-repo
          rc=$?
          set -e
          if [[ -f "$log" ]]; then
            echo "===== canonical validator log ====="
            cat "$log"
          fi
          exit "$rc"
