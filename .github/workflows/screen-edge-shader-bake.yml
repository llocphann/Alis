name: Bake Screen Edge Analytic Shader

on:
  push:
    paths:
      - ".github/workflows/screen-edge-shader-bake.yml"
      - "modules/screenCorners/ScreenEdgeField.frag"

permissions:
  contents: write

jobs:
  bake:
    runs-on: ubuntu-latest
    container: debian:sid
    steps:
      - name: Install deterministic tools
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ca-certificates python3 qt6-shader-baker

      - name: Checkout dev
        uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 1

      - name: Bake reproducible Screen Edge QSB
        run: |
          set -euo pipefail
          cd /__w/Alis/Alis

          QSB="$(command -v qsb || true)"
          if [ -z "$QSB" ]; then QSB=/usr/lib/qt6/bin/qsb; fi
          "$QSB" --version

          src=modules/screenCorners/ScreenEdgeField.frag
          out=/tmp/ScreenEdgeField.frag.qsb
          second=/tmp/ScreenEdgeField.second.frag.qsb

          "$QSB" --qt6 -o "$out" "$src"
          "$QSB" --dump "$out" >/dev/null
          "$QSB" --qt6 -o "$second" "$src"
          cmp "$second" "$out"

          sha256sum "$src" "$out"

      - name: Publish QSB if source still matches dev
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd /__w/Alis/Alis
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          api = f"https://api.github.com/repos/{repo}"
          source_path = "modules/screenCorners/ScreenEdgeField.frag"
          qsb_path = "modules/screenCorners/ScreenEdgeField.frag.qsb"

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = Request(
                  api + path,
                  data=data,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "alis-screen-edge-qsb-baker",
                  },
              )
              with urlopen(req) as response:
                  return json.load(response)

          local_source = Path(source_path).read_bytes()
          remote_source = request("GET", f"/contents/{source_path}?ref=dev")
          remote_source_bytes = base64.b64decode(remote_source["content"])
          if remote_source_bytes != local_source:
              raise SystemExit("dev ScreenEdgeField.frag moved during bake; refusing stale QSB publish")

          baked = Path("/tmp/ScreenEdgeField.frag.qsb").read_bytes()
          current_qsb_sha = None
          try:
              current_qsb = request("GET", f"/contents/{qsb_path}?ref=dev")
              current_qsb_sha = current_qsb["sha"]
              if base64.b64decode(current_qsb["content"]) == baked:
                  print("Screen Edge QSB already matches current dev source")
                  raise SystemExit(0)
          except HTTPError as exc:
              if exc.code != 404:
                  raise

          payload = {
              "message": "build(screen-edge): bake analytic field QSB",
              "content": base64.b64encode(baked).decode(),
              "branch": "dev",
          }
          if current_qsb_sha:
              payload["sha"] = current_qsb_sha

          result = request("PUT", f"/contents/{qsb_path}", payload)
          print("published_qsb_commit=" + result["commit"]["sha"])
          PY
