name: Apply Aqua Shader Optimization

on:
  push:
    paths:
      - ".github/workflows/shader-candidate-bake.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    container: debian:sid
    steps:
      - name: Install deterministic tools
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git ca-certificates python3 qt6-shader-baker

      - name: Checkout dev
        uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply and validate strict-lossless Aqua candidate
        run: |
          set -euo pipefail
          git config user.name "Alis Shader Baker"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin dev
          git reset --hard origin/dev

          QSB="$(command -v qsb || true)"
          if [ -z "$QSB" ]; then QSB=/usr/lib/qt6/bin/qsb; fi
          "$QSB" --version

          "$QSB" --qt6 -o /tmp/WaterDropletMaterial.baseline.qsb modules/abyss/companion/WaterDropletMaterial.frag
          cmp /tmp/WaterDropletMaterial.baseline.qsb modules/abyss/companion/WaterDropletMaterial.frag.qsb

          python3 scripts/build-aqua-material-candidate.py /tmp/WaterDropletMaterial.frag
          cp /tmp/WaterDropletMaterial.frag modules/abyss/companion/WaterDropletMaterial.frag
          "$QSB" --qt6 -o modules/abyss/companion/WaterDropletMaterial.frag.qsb modules/abyss/companion/WaterDropletMaterial.frag
          "$QSB" --dump modules/abyss/companion/WaterDropletMaterial.frag.qsb >/dev/null

          python3 scripts/test-aqua-procedural-visual-contract.py
          python3 scripts/test-aqua-idle-resource-contract.py

          git add modules/abyss/companion/WaterDropletMaterial.frag modules/abyss/companion/WaterDropletMaterial.frag.qsb
          git commit -m "perf(aqua): skip inactive bubble ray work"

          git fetch origin dev
          git rebase origin/dev

          python3 scripts/test-aqua-procedural-visual-contract.py
          python3 scripts/test-aqua-idle-resource-contract.py
          bash scripts/validate-maintainer-local.sh --current-repo

          git fetch origin dev
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/dev)"
          git push origin HEAD:dev
