name: Native Rust staging

on:
  push:
    paths:
      - 'native/**'
      - 'scripts/native-dispatch'
      - 'scripts/native-cutover-benchmark.sh'
      - 'scripts/test-native-selector-contract.sh'
      - 'scripts/test-native-selector-behavior.sh'
      - 'scripts/test-native-production-contract.sh'
      - 'scripts/native-backend'
      - 'sdata/migrations/050-rust-native-default.sh'
      - 'scripts/benchmark-python-vs-rust.sh'
      - 'scripts/test-native-benchmark-deep-contract.sh'
      - 'native/scripts/check-niri-customizations.py'
      - 'scripts/inir'
      - 'services/KeyboardIndicators.qml'
      - 'services/NiriService.qml'
      - 'services/LocalMusic.qml'
      - 'services/IconThemeService.qml'
      - 'services/Wallpapers.qml'
      - 'services/deferred/Cliphist.qml'
      - 'services/deferred/NiriKeybinds.qml'
      - 'modules/onScreenKeyboard/PhysicalKeyboardFeedback.qml'
      - 'modules/settings/NiriConfig.qml'
      - 'modules/settings/MonitorVisibilityConfig.qml'
      - 'scripts/colors/generate_colors_material.py'
      - 'scripts/colors/generate_terminal_configs.py'
      - 'scripts/colors/switchwall.sh'
      - 'scripts/colors/lib/publish-if-changed.sh'
      - 'scripts/colors/modules/90-cava.sh'
      - 'scripts/test-theme-file-publication.sh'
      - 'scripts/test-cava-cover-color-refresh-contract.py'
      - 'scripts/test-forced-dark-seed-reuse.py'
      - 'scripts/test-theme-sddm-deferral.py'
      - 'scripts/test-theme-perf-04.py'
      - 'scripts/benchmark-auto-theming.py'
      - 'scripts/collect-auto-theme-diagnostics.py'
      - 'scripts/collect-auto-theme-diagnostics.sh'
      - 'scripts/test-theme-perf-05.py'
      - 'scripts/test-theme-seed-cache.py'
      - 'scripts/collect-auto-theme-runtime.py'
      - 'scripts/collect-auto-theme-runtime.sh'
      - 'scripts/test-theme-runtime-08.py'
      - 'scripts/colors/lib/theme-profile.sh'
      - 'scripts/sddm/sync-pixel-sddm.py'
      - 'scripts/colors/applycolor.sh'
      - 'scripts/colors/apply-gtk-theme.sh'
      - 'scripts/colors/icon-theme-for-mode.sh'
      - 'scripts/colors/vscode_themegen/**'
      - 'scripts/test-light-mode-upstream-contract.py'
      - 'scripts/test-wallpaper-mode.py'
      - 'services/MaterialThemeLoader.qml'
      - 'modules/common/ThemePresets.qml'
      - 'modules/common/functions/ColorUtils.qml'
      - 'defaults/niri/config.d/50-startup.kdl'
      - 'sdata/migrations/049-native-clipboard-selector.sh'
      - '.github/workflows/native-rust.yml'
  pull_request:
    paths:
      - 'native/**'
      - 'scripts/native-dispatch'
      - 'scripts/test-native-selector-behavior.sh'
      - 'scripts/test-native-production-contract.sh'
      - 'scripts/native-backend'
      - 'sdata/migrations/050-rust-native-default.sh'
      - 'native/scripts/check-niri-customizations.py'
      - 'scripts/colors/generate_colors_material.py'
      - 'scripts/colors/generate_terminal_configs.py'
      - 'scripts/colors/switchwall.sh'
      - 'scripts/colors/lib/publish-if-changed.sh'
      - 'scripts/colors/modules/90-cava.sh'
      - 'scripts/test-theme-file-publication.sh'
      - 'scripts/test-cava-cover-color-refresh-contract.py'
      - 'scripts/test-forced-dark-seed-reuse.py'
      - 'scripts/test-theme-sddm-deferral.py'
      - 'scripts/test-theme-perf-04.py'
      - 'scripts/benchmark-auto-theming.py'
      - 'scripts/collect-auto-theme-diagnostics.py'
      - 'scripts/collect-auto-theme-diagnostics.sh'
      - 'scripts/test-theme-perf-05.py'
      - 'scripts/test-theme-seed-cache.py'
      - 'scripts/collect-auto-theme-runtime.py'
      - 'scripts/collect-auto-theme-runtime.sh'
      - 'scripts/test-theme-runtime-08.py'
      - 'scripts/colors/lib/theme-profile.sh'
      - 'scripts/sddm/sync-pixel-sddm.py'
      - 'scripts/colors/applycolor.sh'
      - 'scripts/colors/apply-gtk-theme.sh'
      - 'scripts/colors/icon-theme-for-mode.sh'
      - 'scripts/colors/vscode_themegen/**'
      - 'scripts/test-light-mode-upstream-contract.py'
      - 'scripts/test-wallpaper-mode.py'
      - 'services/MaterialThemeLoader.qml'
      - 'modules/common/ThemePresets.qml'
      - 'modules/common/functions/ColorUtils.qml'
      - '.github/workflows/native-rust.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: Install Go from module
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Assert production native selector boundary
        run: |
          python3 native/scripts/assert-dormant.py
          bash -n scripts/native-dispatch
          bash -n scripts/native-cutover-benchmark.sh
          bash -n scripts/benchmark-python-vs-rust.sh
          bash -n scripts/colors/switchwall.sh
          bash -n scripts/colors/lib/publish-if-changed.sh
          bash -n scripts/test-theme-file-publication.sh
          bash scripts/test-theme-file-publication.sh
          python3 scripts/test-cava-cover-color-refresh-contract.py
          python3 scripts/test-forced-dark-seed-reuse.py
          python3 scripts/test-theme-sddm-deferral.py
          bash -n scripts/colors/lib/theme-profile.sh
          bash -n scripts/colors/applycolor.sh
          python3 -m py_compile scripts/benchmark-auto-theming.py
          python3 scripts/test-theme-perf-04.py
          bash -n scripts/collect-auto-theme-runtime.sh
          python3 -m py_compile scripts/collect-auto-theme-runtime.py scripts/test-theme-runtime-08.py
          python3 scripts/test-theme-runtime-08.py
          bash -n scripts/collect-auto-theme-diagnostics.sh
          python3 -m py_compile scripts/collect-auto-theme-diagnostics.py scripts/test-theme-perf-05.py
          python3 scripts/test-theme-perf-05.py
          python3 -m py_compile scripts/test-theme-seed-cache.py
          python3 -m py_compile scripts/sddm/sync-pixel-sddm.py scripts/colors/generate_colors_material.py
          bash -n scripts/colors/applycolor.sh
          bash -n scripts/colors/apply-gtk-theme.sh
          python3 scripts/test-light-mode-upstream-contract.py
          python3 scripts/test-wallpaper-mode.py
          go test ./scripts/colors/vscode_themegen
          bash -n sdata/migrations/049-native-clipboard-selector.sh
          bash scripts/test-native-selector-contract.sh
          bash scripts/test-native-selector-behavior.sh
          bash scripts/test-native-production-contract.sh
          bash -n scripts/native-backend
          bash -n native/scripts/install-runtime.sh
          bash -n sdata/migrations/050-rust-native-default.sh
          bash scripts/test-native-benchmark-deep-contract.sh

      - name: Rustfmt
        run: cargo fmt --manifest-path native/Cargo.toml --all -- --check

      - name: Clippy
        run: cargo clippy --locked --manifest-path native/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --locked --manifest-path native/Cargo.toml --workspace --all-targets

      - name: Niri customization parity fixtures
        run: |
          cargo build --locked --manifest-path native/Cargo.toml -p alis-native
          python3 native/scripts/check-niri-customizations.py native/target/debug/alis-native
          python3 native/scripts/check-niri-write-parity.py native/target/debug/alis-native

      - name: MPD isolated status and mutation parity
        run: |
          cargo build --locked --manifest-path native/Cargo.toml -p alis-mpdd
          python3 native/scripts/check-mpd-mutation-parity.py native/target/debug/alis-mpdd
          python3 scripts/test-local-music-lean-snapshot.py --rust-binary native/target/debug/alis-mpdd

      - name: Clipboard isolated parity
        run: |
          cargo build --locked --manifest-path native/Cargo.toml -p alis-native
          python3 native/scripts/check-clipboard-parity.py native/target/debug/alis-native

      - name: Desktop icon configuration parity
        run: |
          cargo build --locked --manifest-path native/Cargo.toml -p alis-native
          python3 native/scripts/check-desktop-icon-parity.py native/target/debug/alis-native

      - name: Install Python theme parity dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input numpy pillow materialyoucolor

      - name: Theme image, template and consumer parity
        run: |
          cargo build --locked --manifest-path native/Cargo.toml -p alis-theme
          python3 scripts/test-theme-seed-cache.py native/target/debug/alis-theme
          python3 native/scripts/check-theme-parity.py native/target/debug/alis-theme
