name: BRAND-R01 canonical staging and update owner safety
on:
  push:
    branches:
      - dev
      - brand-r01-canonical-alis
    paths:
      - setup
      - scripts/brand-canonical-stage.sh
      - scripts/test-brand-canonical-stage.sh
      - scripts/test-brand-legacy-owner-update.sh
      - scripts/test-config-namespace-migration.sh
      - scripts/test-brand-post-cutover-migration-guards.sh
      - scripts/test-brand-native-installer-invocation.sh
      - native/scripts/install-runtime.sh
      - sdata/migrations/021-systemd-single-instance.sh
      - sdata/migrations/051-cliphist-single-watchers.sh
      - sdata/migrations/019-config-dir-rename-compat.sh
      - docs/CONFIG_SYSTEM.md
      - scripts/brand-canonical-cutover.sh
      - scripts/test-brand-canonical-cutover.sh
      - scripts/brand-recovery-cli.sh
      - scripts/brand-canonical-rollback.sh
      - scripts/test-brand-canonical-rollback.sh
      - scripts/brand-niri-runtime-paths.py
      - scripts/test-brand-niri-runtime-paths.py
      - scripts/alis
      - scripts/test-brand-cli-session-guard.py
      - scripts/lib/brand-env-compat.sh
      - scripts/test-brand-env-compat.py
      - scripts/brand-canonical-audit.py
      - scripts/test-brand-canonical-audit.py
      - scripts/native-dispatch
      - scripts/lib/config-path.sh
      - sdata/lib/environment-variables.sh
      - sdata/lib/versioning.sh
      - distro/arch/alis-shell/PKGBUILD
      - distro/arch/alis-shell/.SRCINFO
      - scripts/test-brand-canonical-arch-snapshot.sh
      - .github/workflows/brand-update-cutover.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner-update-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate update and pre-cutover stage syntax
        shell: bash
        run: bash -n setup scripts/brand-canonical-stage.sh scripts/brand-canonical-cutover.sh
      - name: Old service retained after successful handoff must not block updates
        shell: bash
        run: bash scripts/test-brand-legacy-owner-update.sh
      - name: Stage canonical source without touching old owner or user data
        shell: bash
        run: bash scripts/test-brand-canonical-stage.sh
      - name: Rust runtime installer must work without execute bit during repo-copy updates
        run: bash scripts/test-brand-native-installer-invocation.sh
      - name: Original owner preserved on rejected or failed cutover
        shell: bash
        run: bash scripts/test-brand-canonical-cutover.sh
      - name: Post-success original-owner rollback and failed-start recovery
        run: bash scripts/test-brand-canonical-rollback.sh
      - name: Niri runtime repair preserves bytes and rolls back partial failures
        run: python3 scripts/test-brand-niri-runtime-paths.py
      - name: Indirect CLI starts preserve the one-owner boundary
        run: python3 scripts/test-brand-cli-session-guard.py
      - name: Retained user environment and config aliases
        run: python3 scripts/test-brand-env-compat.py
      - name: Historical migration 019 remains fail-closed without advertising retired CLI
        run: bash scripts/test-config-namespace-migration.sh
      - name: Original service and clipboard migrations cannot revert canonical ownership
        run: bash scripts/test-brand-post-cutover-migration-guards.sh
      - name: Active quoted commands cannot evade the identity audit
        run: python3 scripts/test-brand-canonical-audit.py
      - name: Pinned Arch CLI preserves the session-owner boundary
        run: bash scripts/test-brand-canonical-arch-snapshot.sh
