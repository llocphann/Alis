# Alis-managed AUDIO-I01: EasyEffects output filters only.
# PipeWire node.rules apply regardless of the application launch method.
# Not a global clock.force-quantum override.
node.rules = [
  {
    matches = [
      { node.name = "~ee_soe_.*" }
    ]
    actions = {
      update-props = {
        node.lock-quantum = true
      }
    }
  }
]
