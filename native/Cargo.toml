[workspace]
resolver = "2"
members = [
    "crates/alis-protocol",
    "alis-inputd",
    "alis-mpdd",
    "alis-native",
    "alis-theme",
]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.95"
version = "1.0.0"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
evdev = "0.13.2"
html-escape = "0.2"
kdl = { version = "6.7.1", features = ["v1-fallback"] }
libc = "0.2"
oxixml-unicode = "0.1.0"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"

# Native binaries are latency-sensitive desktop helpers. Thin LTO retains most
# cross-crate optimization without the extreme link cost of fat LTO; one
# codegen unit improves optimizer visibility for these relatively small apps.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
